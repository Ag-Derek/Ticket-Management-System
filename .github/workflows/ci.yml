name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docket-server
    # Dummy values so db/connection.js loads; test/setup.js sets the rest.
    # The pool only connects on the first query, so no database is needed.
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v7

      # Same Node version as Render, which reads engines.node in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version-file: docket-server/package.json
          cache: npm
          cache-dependency-path: docket-server/package-lock.json

      # better-sqlite3 is a dev dependency only used by the old SQLite
      # migration; skipping it avoids a native build.
      - run: npm ci --omit=dev

      - run: npm test

  # Spell-check UI text, docs and comments. Words cspell doesn't know but
  # are real (Docket, Supabase, Resend, ...) go in cspell.json.
  # On a PR, misspellings also get inline comments with a one-click fix and
  # a summary comment listing the options (.github/scripts/spelling-review.js).
  spelling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # cspell 10 needs Node 22.18 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check spelling
        id: cspell
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes cspell@10.4.1 --no-progress --show-suggestions --no-color 2>&1 | tee cspell-report.txt

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/spelling-review.js');
            await run({ github, context, core, reportPath: 'cspell-report.txt' });

      - name: Fail if there are spelling issues
        if: steps.cspell.outcome == 'failure'
        run: |
          echo "Spelling issues found. See the PR comments or the 'Check spelling' step above."
          exit 1
