<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remat Technologies — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-step="1">
<div class="scene">

  <div class="topbar">
    <a class="logo" href="landing.html"><span class="logo-mark">R</span>Remat</a>
    <div class="steps">
      <span class="step-pill" data-step="0"><span class="num">1</span>Landing</span>
      <span class="step-pill" data-step="1"><span class="num">2</span>Login</span>
      <span class="step-pill" data-step="2"><span class="num">3</span>Profile</span>
      <span class="step-pill" data-step="3"><span class="num">4</span>Ticket</span>
      <span class="step-pill" data-step="4"><span class="num">5</span>Portal</span>
    </div>
    <button class="topbar-cta" type="button" style="visibility:hidden;" aria-hidden="true">Log in</button>
  </div>

  <section>
    <div class="card-panel" id="signInForm">
      <div class="login-mark">→</div>
      <h2>Sign in</h2>
      <p class="lead">Enter the email on your account and we'll send you a 6-digit sign-in code.</p>

      <div class="field" id="f-signInEmail">
        <label for="signInEmail">Email address</label>
        <input type="email" id="signInEmail" placeholder="you@company.com" autocomplete="email">
        <div class="err" id="err-signInEmail">Enter a valid email address.</div>
      </div>

      <button class="btn-amber" id="submitSignIn" type="button">Send sign-in code</button>
      <p class="form-switch">New here? <a href="profile.html">Create an account</a></p>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
