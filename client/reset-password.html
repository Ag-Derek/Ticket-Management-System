<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Remat Technologies — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">

  <div class="topbar">
    <a class="logo" href="landing.html"><span class="logo-mark">R</span>Remat</a>
  </div>

  <section>
    <div class="card-panel">

      <div id="resetPasswordForm">
        <div class="login-mark">⬡</div>
        <h2>Choose a new password</h2>
        <p class="lead">Use at least 8 characters. After saving, sign in with your new password as usual.</p>

        <div class="field" id="f-newPassword">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
          <div class="err" id="err-newPassword">Use at least 8 characters.</div>
        </div>

        <div class="field" id="f-confirmPassword">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
          <div class="err" id="err-confirmPassword">The passwords don't match.</div>
        </div>

        <button class="btn-amber" id="submitResetPassword" type="button">Save new password</button>
      </div>

      <div class="stub" id="resetPasswordStub">
        <p class="eyebrow" style="margin-bottom:8px;">Done</p>
        <h2 style="margin-bottom:6px;">Password updated</h2>
        <p class="lead" style="margin:0 0 24px;">You can now sign in with your new password.</p>
        <a class="btn-amber" id="resetPasswordSignIn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;" href="admin-login.html">Go to sign in →</a>
      </div>

    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
